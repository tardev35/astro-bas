  <head>
    <meta charset="utf-8" />
    <!-- The whole point of this page. It only works because robots.txt lets
         crawlers in: a blocked page can never be read, so its noindex is never
         seen, and the bare URL can still be indexed from the certificate
         transparency log. Do not "harden" this by adding Disallow: / — that
         produces the exact outcome this page exists to prevent. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="googlebot" content="noindex, nofollow" />
